services:
  hai:
    build:
      context: .
      dockerfile: Dockerfile.rocm
      args:
        ROCM_IMAGE: ${HAI_CONTAINER_IMAGE:-rocm/pytorch:rocm10.0_ubuntu24.04_py3.12_pytorch_release_2.12.0}
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-heterogeneous-ai}
    volumes:
      - .:/workspace
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    # GPU device mappings are required for ROCm. Keep the container on its
    # default IPC and seccomp isolation; do not run untrusted code here.
    stdin_open: true
    tty: true

  mlflow:
    image: ${HAI_CONTAINER_IMAGE:-heterogeneous-ai-hai}
    working_dir: /mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --allowed-hosts
      - localhost:5000,127.0.0.1:5000,mlflow:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./artifacts/mlflow:/mlflow
