id: transformer-baseline-v1
architecture: causal_decoder_transformer
initialization: random
vocab_size_from_tokenizer: true
hidden_size: 512
intermediate_size: 1536
num_hidden_layers: 8
num_attention_heads: 8
num_key_value_heads: 2
context_length: 512
tie_word_embeddings: true
parameter_target: "25M-35M; record exact computed count"
seed: 1337
precision: fp16
micro_batch_size: 4
gradient_accumulation_steps: 16
learning_rate: 0.0003
weight_decay: 0.1
warmup_ratio: 0.03
scheduler: cosine
gradient_clip_norm: 1.0
checkpointing:
  save_optimizer: true
  save_scheduler: true
  save_rng_state: true
logging:
  metrics_jsonl: true
  log_peak_vram: true
