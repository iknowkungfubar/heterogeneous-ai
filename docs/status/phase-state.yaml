project: heterogeneous-ai
current_phase: P16
status: ready
phases:
  P00:
    name: Repository bootstrap
    status: passed
    depends_on: []
    evidence:
    - docs/experiment-reports/P00-repository-bootstrap-2026-09-13.md
    notes: 'Bootstrap checks passed; no host, GPU, data, or model changes performed.'
  P01:
    name: Host, GPU, Docker, and ROCm environment
    status: passed
    depends_on:
    - P00
    evidence:
    - docs/experiment-reports/P01-host-preflight-2026-09-13.md
    - docs/experiment-reports/P01-rocm-container-attempt-2026-09-14.md
    - docs/experiment-reports/P01-rocm-container-complete-2026-09-14.md
    notes: 'ROCm/PyTorch image and Compose runtime validated; build used an explicit host-network override because default BuildKit DNS could not resolve pypi.org.'
  P02:
    name: PyTorch fundamentals and GPU training smoke tests
    status: passed
    depends_on:
    - P01
    evidence:
    - docs/experiment-reports/P02-pytorch-gpu-smoke-2026-09-14.md
    notes: 'GPU fundamentals, convergence, peak memory, and checkpoint round-trip passed in the validated ROCm Compose image.'
  P03:
    name: Data governance and dataset pipeline
    status: passed
    depends_on:
    - P02
    evidence:
    - docs/experiment-reports/P03-data-governance-implementation-2026-09-14.md
    - docs/experiment-reports/P03-data-governance-complete-2026-09-14.md
    notes: 'TinyStories smoke data was acquired through the allowlisted Parquet path, normalized into read-only raw JSONL, deterministically split, checksummed, and verified; upstream immutable revision pinning remains a release follow-up.'
  P04:
    name: Tokenizer from scratch
    status: passed
    depends_on:
    - P03
    evidence:
    - docs/experiment-reports/P04-tokenizer-from-scratch-2026-09-14.md
    notes: 'Project-owned BPE tokenizer trained from TRAIN only; artifact provenance, exact edge-case round trips, vocabulary statistics, and source hashes verified.'
  P05:
    name: Tiny Transformer pipeline smoke model
    status: passed
    depends_on:
    - P04
    evidence:
    - docs/experiment-reports/P05-tiny-transformer-smoke-2026-09-14.md
    notes: 'Randomly initialized causal decoder trained on governed token blocks; CUDA loss reduction, checkpoint/resume, validation, and generation all passed. The short run is plumbing evidence only, not a quality claim.'
  P06:
    name: Scratch-trained Transformer baseline
    status: passed
    depends_on:
    - P05
    evidence:
    - docs/experiment-reports/P06-transformer-baseline-2026-09-14.md
    - docs/model-cards/transformer-baseline-v1.md
    notes: 'Smoke-scale 25.5M parameter scratch baseline trained on governed TinyStories data; preflight resources, 300-step CUDA training, checkpoint hash, validation, and generation recorded. BabyLM remains deferred under ADR-0004.'
  P07:
    name: Independent sequence specialist
    status: passed
    depends_on:
    - P06
    evidence:
    - docs/experiment-reports/P07-gru-sequence-specialist-2026-09-14.md
    - docs/model-cards/gru-sequence-v1.md
    notes: 'Randomly initialized GRU trained on the same governed corpus/tokenizer; validation and paired token-level error analysis recorded 20.6787% exact-one-correct complementarity, with both-wrong limitations preserved.'
  P08:
    name: Deterministic symbolic reasoning specialist
    status: passed
    depends_on:
    - P07
    evidence:
    - docs/experiment-reports/P08-symbolic-reasoning-2026-09-14.md
    notes: 'Typed exact arithmetic, algebra, Boolean, bounded constraints, deterministic graph traversal, unit conversion, and ISO-date adapters verified with traces and adversarial rejection tests.'
  P09:
    name: Objective benchmark framework
    status: passed
    depends_on:
    - P08
    evidence:
    - docs/experiment-reports/P09-objective-benchmark-2026-09-14.md
    notes: 'Seven-category deterministic benchmark generated with 84 records per split, verified hash/disjointness, exact symbolic validation scoring, and explicit not-applicable statuses for learned experts without structured adapters.'
  P10:
    name: Unified expert protocol and provenance
    status: passed
    depends_on:
    - P09
    evidence:
    - docs/experiment-reports/P10-unified-expert-protocol-2026-09-14.md
    notes: 'Versioned ExpertResult/EvidenceRef contracts and three core adapters verified with serialization, provenance, latency/status fields, and explicit not-applicable learned states.'
  P11:
    name: Learned task router
    status: passed
    depends_on:
    - P10
    evidence:
    - docs/experiment-reports/P11-learned-task-router-2026-09-14.md
    notes: 'TRAIN-only interpretable router passed governance, utility-preservation, and traceability gates; current one-class expert pool yields no call-cost improvement, and unknown categories abstain.'
  P12:
    name: Verification layer
    status: passed
    depends_on:
    - P11
    evidence:
    - docs/experiment-reports/P12-verification-layer-2026-09-14.md
    notes: 'Independent deterministic verification passed all 84 validation records, rejected adversarial wrong candidates, and exposes exact/rejected/abstain strength to consensus.'
  P13:
    name: Calibration, consensus, and abstention
    status: passed
    depends_on:
    - P12
    evidence:
    - docs/experiment-reports/P13-calibration-consensus-abstention-2026-09-14.md
    notes: 'Validation-only calibration reported ECE/Brier for three methods; evidence-aware consensus accepted 24 independently verified outputs and abstained on 60 unsupported outputs for 100% selective accuracy.'
  P14:
    name: Core heterogeneous ablation study and M2 freeze
    status: passed
    depends_on:
    - P13
    evidence:
    - docs/experiment-reports/P14-core-heterogeneous-ablation-m2-2026-09-14.md
    notes: 'Frozen TEST ablation completed with bootstrap intervals; heterogeneous-core matched symbolic-only at 28.57% task accuracy and 28.57% coverage, all-experts tripled calls without improvement, and learned baselines were explicitly not applicable.'
  P15:
    name: Scratch-trained semantic retrieval
    status: passed
    depends_on:
    - P14
    evidence:
    - docs/experiment-reports/P15-scratch-trained-semantic-retrieval-2026-09-14.md
    notes: 'Random-initialized dual encoder trained on 512 TRAIN stories; dense retrieval beat random and hybrid beat lexical on 256 VALIDATION queries with manifest-bound provenance.'
